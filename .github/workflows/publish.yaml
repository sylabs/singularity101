name: Publish PDF
on:
  release:
    types: ["published"]
jobs:
  publish-pdf:
    name: publish-pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Setup Chrome/Chromium web browser
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded #v2.1.1
        with:
          chrome-version: latest
        id: setup-chrome
      - name: Building tutorial PDF file
        run: |
          jupyter-book build ./ --builder singlehtml
          echo Installed chromium version: ${{ steps.setup-chrome.outputs.chrome-version }}
          ${{ steps.setup-chrome.outputs.chrome-path }} --headless --disable-gpu --print-to-pdf file:///$(pwd)/_build/singlehtml/intro.html
      - name: Upload PDF to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de #v2.11.5
        with:
          asset_name: Sylabs_Singularity101-${{ github.ref_name }}.pdf
          #tag: "PDF"
          tag: ${{ github.ref }}
          overwrite: true
          file: output.pdf
